name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xucuz
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: xucuz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xucuz -d xucuz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATA_MODE: demo
      DATABASE_URL: postgres://xucuz:test-only@localhost:5432/xucuz_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
