name: Public source discovery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-source-discovery
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xucuz-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sources:probe
      - name: Publish source diagnostics without changing prices
        shell: bash
        run: |
          set -euo pipefail
          cp data/source-probes.json /tmp/xucuz-source-probes.json
          git fetch origin price-data
          git switch --discard-changes --force-create price-data origin/price-data
          cp /tmp/xucuz-source-probes.json source-probes.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-probes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record public source discovery results'
          git push origin HEAD:price-data
